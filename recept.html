<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Receptförslag</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
    <header><h1>Receptförslag</h1></header>
    <nav class="navbar">
        <a href="index.html">Hem</a>
        <a href="skafferi.html">Skafferi</a>
        <a href="inkopslista.html">Inköpslista</a>
        <a href="planering.html">Planering</a>
        <a href="preferenser.html">Preferenser</a>
    </nav>
    <section>
        <h2>Ange ingredienser</h2>
        <input type="text" id="ingredients" placeholder="t.ex. morot, pasta, linser" />
        <button onclick="getRecipe()">Hämta receptförslag</button>
        <div id="recipeResult"></div>
    </section>
    <script>
        function getRecipe() {
            const input = document.getElementById("ingredients").value;
            const result = document.getElementById("recipeResult");
            result.innerHTML = "Laddar AI-förslag...";
            setTimeout(() => {
                result.innerHTML = `
                    <h3>Förslag baserat på: ${input}</h3>
                    <ul>
                        <li><b>Grönsakslinsgryta</b> – Morot, lök och linser med en extra grönsak (broccoli) för näring. Blodsockertips: Ät långsamt och börja med grönsakerna.</li>
                        <li><b>Pastagratäng</b> – Pasta blandas med tomater, spenat och ost, perfekt barnvänligt. Tips: Servera med en fräsch sallad för extra fibrer.</li>
                    </ul>
                    <button onclick="cookRecipe()">Laga detta</button>
                `;
            }, 1000);
        }
        function cookRecipe() {
            let inv = JSON.parse(localStorage.getItem('inventory')) || [];
            // Simulera att vi behöver "morot", "lök", "linser" och "broccoli"
            let needed = ["morot", "lök", "linser", "broccoli"];
            let missing = needed.filter(item => !inv.includes(item));
            let shopping = JSON.parse(localStorage.getItem('shopping')) || [];
            shopping = shopping.concat(missing);
            localStorage.setItem('shopping', JSON.stringify(shopping));
            alert("Receptet lagas! Saknade ingredienser har lagts till inköpslistan.");
        }
<script>
  async function getRecipe() {
      const input = document.getElementById("ingredients").value;
      const result = document.getElementById("recipeResult");
      result.innerHTML = "Laddar AI-förslag...";

      try {
          const response = await fetch("/.netlify/functions/openai", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({ userInput: input })
          });
          const data = await response.json();
          result.innerHTML = `<h3>Förslag:</h3><p>${data.output}</p>`;
      } catch (error) {
          console.error(error);
          result.innerHTML = "<p>Ett fel uppstod. Försök igen senare.</p>";
      }
  }
</script>
</body>
</html>
