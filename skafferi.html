<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Skafferi</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
    <header><h1>Skafferi</h1></header>
    <nav class="navbar">
        <a href="index.html">Hem</a>
        <a href="recept.html">Receptförslag</a>
        <a href="inkopslista.html">Inköpslista</a>
        <a href="planering.html">Planering</a>
        <a href="preferenser.html">Preferenser</a>
    </nav>
    <section>
        <h2>Lägg till vara</h2>
        <input type="text" id="itemInput" placeholder="Ange vara, t.ex. ägg" />
        <button onclick="addItem()">Lägg till</button>
        <h3>Ditt skafferi:</h3>
        <ul id="inventoryList"></ul>
    </section>
    <script>
        function loadInventory() {
            let inv = JSON.parse(localStorage.getItem('inventory')) || [];
            let list = document.getElementById('inventoryList');
            list.innerHTML = "";
            inv.forEach((item, index) => {
                list.innerHTML += `<li>${item} <button onclick="removeItem(${index})">Ta bort</button></li>`;
            });
        }
        function addItem() {
            let input = document.getElementById('itemInput').value;
            if(input){
                let inv = JSON.parse(localStorage.getItem('inventory')) || [];
                inv.push(input);
                localStorage.setItem('inventory', JSON.stringify(inv));
                document.getElementById('itemInput').value = "";
                loadInventory();
            }
        }
        function removeItem(index) {
            let inv = JSON.parse(localStorage.getItem('inventory')) || [];
            inv.splice(index, 1);
            localStorage.setItem('inventory', JSON.stringify(inv));
            loadInventory();
        }
        window.onload = loadInventory;
    </script>
</body>
</html>
