<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Inköpslista</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
    <header><h1>Inköpslista</h1></header>
    <nav class="navbar">
        <a href="index.html">Hem</a>
        <a href="recept.html">Receptförslag</a>
        <a href="planering.html">Planering</a>
        <a href="skafferi.html">Skafferi</a>
        <a href="preferenser.html">Preferenser</a>
    </nav>
    <section>
        <h2>Dina köp</h2>
        <ul id="shoppingList"></ul>
    </section>
    <script>
        function loadShopping() {
            let shopping = JSON.parse(localStorage.getItem('shopping')) || [];
            let list = document.getElementById('shoppingList');
            list.innerHTML = "";
            shopping.forEach((item, index) => {
                list.innerHTML += `<li>${item} <button onclick="removeShoppingItem(${index})">Ta bort</button></li>`;
            });
        }
        function removeShoppingItem(index) {
            let shopping = JSON.parse(localStorage.getItem('shopping')) || [];
            shopping.splice(index, 1);
            localStorage.setItem('shopping', JSON.stringify(shopping));
            loadShopping();
        }
        window.onload = loadShopping;
    </script>
</body>
</html>
