<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Preferenser</title>
    <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
    <header><h1>Preferenser</h1></header>
    <nav class="navbar">
        <a href="index.html">Hem</a>
        <a href="recept.html">Receptförslag</a>
        <a href="inkopslista.html">Inköpslista</a>
        <a href="planering.html">Planering</a>
        <a href="skafferi.html">Skafferi</a>
    </nav>
    <section>
        <h2>Ange dina preferenser</h2>
        <form id="preferencesForm">
            <label><input type="checkbox" name="eko" onchange="savePreferences()"> Ekologiskt</label><br>
            <label><input type="checkbox" name="budget" onchange="savePreferences()"> Budgetvänligt</label><br>
            <label><input type="checkbox" name="barn" onchange="savePreferences()"> Barnvänligt</label><br>
            <label><input type="checkbox" name="inga_halvfabrikat" onchange="savePreferences()"> Inga halvfabrikat</label><br>
        </form>
        <p>Dina preferenser sparas automatiskt.</p>
    </section>
    <script>
    function savePreferences() {
        const form = document.getElementById('preferencesForm');
        let prefs = {};
        for (let i = 0; i < form.elements.length; i++) {
            let el = form.elements[i];
            if (el.type === "checkbox") {
                prefs[el.name] = el.checked;
            }
        }
        localStorage.setItem('preferences', JSON.stringify(prefs));
    }
    </script>
</body>
</html>
